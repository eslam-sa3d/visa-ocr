name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: visa }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/visa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - run: python -m pyflakes app tools tests
      - run: python -m pytest -q
      - run: pip install rapidocr-onnxruntime==1.2.3
      - run: python tools/accuracy_gate.py --n 2   # fails the build on any silent wrong read or a drop in accuracy
